name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: .github/actions/checkout
    - uses: .github/actions/gradle-cache
    - name: Set up java
      uses: actions/setup-java@v1
      with:
        java-version: 11
    - uses: .github/actions/gradle-make-exec
    - name: Build
      run: ./gradlew clean check publishToIntegrationRepository --stacktrace --no-daemon
    - uses: actions/upload-artifact@v2
      with:
        name: integration-repository
        path: build/repos/integration

  integration:
    needs: build
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        kotlin: [ 1.4.32, 1.5.31, 1.6.20 ]
        jdk: [ 8, 11, 17 ]
        exclude:
          - jdk: 17
            kotlin: 1.4.32

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Disable autocrlf
      run: | 
        git config --global core.autocrlf false
        git config --global core.eol lf

    - uses: .github/actions/checkout
    - uses: .github/actions/cache
    - name: Set up java
      uses: actions/setup-java@v1
      with:
        java-version: ${{ matrix.jdk }}
    - uses: .github/actions/gradle-make-exec
    - uses: actions/download-artifact@v2
      with:
        name: integration-repository
        path: build/repos/integration
    - name: Integration tests
      working-directory: gradle-plugin-integration-test
      run: ./gradlew "-Dkotlin.version=${{ matrix.kotlin }}" clean build --stacktrace
